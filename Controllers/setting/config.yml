      nom_vend_z1:    "Nom_Vend Z1"
      cod_vend_z1: "Cod_vend ZA"
      nom_vend_za: "Nom_Vend ZA"
      
  
  drv_coordenadas:
    nom_base: 'DriverCoordenadas.xlsx'
    sheet: 'Base'
    concatenar_cols : 
      cols : ["Código ECOM", "Agente Comercial"]
      nueva_columna : "llave_compuesta"
      usar_separador : True
      separador : "_"


