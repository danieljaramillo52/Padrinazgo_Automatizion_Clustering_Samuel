    sheet: "Maestra"
  universo_indirecta:
    nom_base: 'Universo Indirecta.xlsm'
    sheet: "BD"
    concatenar_cols : 
      cols : ["r_id_agente_comercial", "r_id_cliente"]
      nueva_columna : "llave_compuesta"
      usar_separador : True
      separador : "_"
  Path_Directa:
    path: 'Directa/'
    patron: '.xlsx'
  Path_Indirecta:
    path: 'Indirecta/'
    sheet: 'Base' 
  base_socios:
    nom_base: 'BaseSocios.xlsm'
    sheet: 'Consolidado'
    
    columnas_socios_merge:
      atencion: "Atención"
      tip_socios:  "Tipo Socios"   # Columnas necesarias para el merge entre base socios y universos.
